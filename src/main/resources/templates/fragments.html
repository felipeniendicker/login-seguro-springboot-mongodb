<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="cabecalho" th:fragment="cabecalho(titulo)">
	<div class="container cabecalho-conteudo">
		<a class="marca" th:href="@{/}">Login Seguro</a>
		<span class="pagina-titulo" th:text="${titulo}">Página</span>
	</div>
</header>

<nav class="navegacao" th:fragment="navegacao(perfil)" aria-label="Navegação principal">
	<a th:href="@{/painel/usuario}">Usuário</a>
	<a th:if="${perfil == 'MODERADOR' or perfil == 'ADMIN'}"
	   th:href="@{/painel/moderador}">Moderador</a>
	<a th:if="${perfil == 'ADMIN'}" th:href="@{/painel/admin}">Administrador</a>
	<form class="form-inline" th:action="@{/api/auth/logout(web=true)}" method="post">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
		<button class="botao botao-secundario" type="submit">Sair</button>
	</form>
</nav>

<footer class="rodape" th:fragment="rodape">
	<p>Projeto acadêmico de Programação para Internet</p>
</footer>
</body>
</html>
