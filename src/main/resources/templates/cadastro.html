<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cadastro | Login Seguro</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments :: cabecalho('Cadastro')}"></header>
<main class="container conteudo-central">
	<section class="cartao formulario-cartao">
		<h1>Crie sua conta</h1>
		<p class="subtitulo">Todo novo cadastro recebe o perfil USUARIO.</p>

		<form th:action="@{/cadastro}" th:object="${cadastro}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

			<label for="nome">Nome</label>
			<input id="nome" type="text" th:field="*{nome}" autocomplete="name" required>
			<p class="campo-erro" th:if="${#fields.hasErrors('nome')}"
			   th:errors="*{nome}">Nome inválido</p>

			<label for="email">E-mail</label>
			<input id="email" type="email" th:field="*{email}" autocomplete="email" required>
			<p class="campo-erro" th:if="${#fields.hasErrors('email')}"
			   th:errors="*{email}">E-mail inválido</p>

			<label for="senha">Senha</label>
			<input id="senha" type="password" th:field="*{senha}"
			       minlength="8" autocomplete="new-password" required>
			<p class="campo-ajuda">Use no mínimo 8 caracteres.</p>
			<p class="campo-erro" th:if="${#fields.hasErrors('senha')}"
			   th:errors="*{senha}">Senha inválida</p>

			<button class="botao" type="submit">Cadastrar</button>
		</form>

		<p class="link-auxiliar">
			Já possui conta? <a th:href="@{/login}">Voltar ao login</a>
		</p>
	</section>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
</body>
</html>
